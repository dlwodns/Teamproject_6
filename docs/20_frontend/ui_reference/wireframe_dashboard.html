<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미처리 메일 · S3 대시보드 와이어프레임</title>
<style>
  :root{
    --bg:#f4f4f2; --frame:#fff; --line:#cfcfcb; --line2:#e4e4e0; --ink:#222; --sub:#6b6b66; --muted:#9a9a94;
    --fill:#2f2f2c; --chip:#ececE8; --hl:#fff6c8;
    --red:#c8372d; --red-bg:#fbe9e7; --orange:#b85c00; --orange-bg:#fff0de; --gray-bg:#efefec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;padding:16px}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.fill{background:var(--fill);color:#fff;border-color:var(--fill)}
  button.ghost{border-color:transparent}
  .code{font:11px ui-monospace,Menlo,Consolas,monospace;color:#7a5cff;background:#f1edff;border-radius:4px;padding:0 4px;margin-right:4px;white-space:nowrap}
  body.nocode .code{display:none}

  /* 테스트 도구 */
  .tools{max-width:1240px;margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
  .tools b{color:var(--ink);margin-right:4px}
  .tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 앱 프레임 */
  .frame{max-width:1240px;margin:0 auto;background:var(--frame);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;min-height:600px}
  .frame.mobile{max-width:375px;min-height:720px}
  .top{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .top .app{font-weight:700}
  .top .menu{display:flex;gap:4px}
  .top .menu button{border:none;border-radius:0;padding:4px 8px;color:var(--sub)}
  .top .menu button.sel{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
  .top .right{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}

  .summary{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);min-height:50px;flex-wrap:wrap}
  .chip{background:var(--chip);border:none;border-radius:999px;padding:3px 10px;font-size:13px}
  .chip strong{margin-left:4px}
  .chip.total{background:var(--ink);color:#fff}
  .chip.red strong{color:var(--red)} .chip.total strong{color:#fff}
  .summary .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff}
  .bulk{background:#2f2f2c;color:#fff}
  .bulk button{border-color:#777;color:#fff}
  .bulk button.fill{background:#fff;color:#222;border-color:#fff}

  .board{display:flex;gap:12px;padding:14px;overflow-x:auto;align-items:flex-start;min-height:480px}
  .col{flex:0 0 300px;background:#f8f8f6;border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;max-height:640px}
  .col.thin{flex:0 0 56px;cursor:pointer}
  .col.thin .colhead{writing-mode:vertical-rl;padding:10px 6px;height:160px}
  .col.flash{outline:3px solid #f2c94c}
  .colhead{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line2);position:relative}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .colhead .t{font-weight:700;cursor:text}
  .colhead .n{color:var(--sub)}
  .colhead .newbtn{font-size:12px;padding:1px 7px;background:#fff6c8;border-color:#e8d27a}
  .colhead .more{margin-left:auto;border:none;padding:0 6px;font-size:16px;line-height:1}
  .colhead .selall{display:none}
  .col:hover .selall,.bulkmode .selall{display:inline-block}
  .lock{font-size:11px;color:var(--muted)}
  .cards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .inline-warn{margin:8px 8px 0;padding:6px 8px;border:1px solid #e3b4ae;background:var(--red-bg);border-radius:6px;font-size:12px;color:var(--red)}
  .empty{color:var(--sub);text-align:center;padding:26px 8px;font-size:13px}
  .card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 9px;display:flex;flex-direction:column;gap:4px;transition:opacity .35s, transform .35s}
  .card.gone{opacity:0;transform:scale(.96)}
  .card.flash{background:var(--hl)}
  .card.selected{outline:2px solid var(--ink)}
  .card .r1{display:flex;align-items:center;gap:6px}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fafaf8}
  .due{font-size:12px;border-radius:4px;padding:0 6px;background:var(--gray-bg);color:var(--sub)}
  .due.overdue{background:var(--red-bg);color:var(--red);font-weight:700}
  .due.today{background:var(--orange-bg);color:var(--orange);font-weight:700}
  .card .ck{margin-left:auto;visibility:hidden}
  .card:hover .ck,.bulkmode .card .ck{visibility:visible}
  .card .title{cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .title:hover{text-decoration:underline}
  .card .r3{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .why{font-size:11px;border-radius:4px;padding:0 5px;border:1px dashed var(--muted)}
  .card .r4{display:flex;gap:6px;align-items:center;margin-top:2px}
  .card .r4 .icon{border-color:transparent;padding:2px 6px}
  .menu-pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:4px;min-width:150px;display:flex;flex-direction:column}
  .menu-pop button{border:none;text-align:left;border-radius:4px;padding:5px 10px}
  .menu-pop button:hover:not(:disabled){background:var(--chip)}

  /* 패널 */
  .panel{position:absolute;top:0;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.08);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .25s ease}
  .panel.open{transform:none}
  .frame.mobile .panel{width:100%}
  .panel header{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);font-weight:700;gap:6px}
  .panel header .x{margin-left:auto;border:none;font-size:16px}
  .panel .body{padding:12px 14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
  .panel label.row{display:flex;gap:8px;align-items:center}
  .panel input[type=text]{flex:1;font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  .panel fieldset{border:none;border-top:1px solid var(--line2);padding-top:8px}
  .panel legend{font-size:12px;color:var(--sub);padding-right:6px}
  .panel .grp{display:flex;gap:4px 10px;flex-wrap:wrap;margin:4px 0 6px}
  .panel .gname{width:64px;color:var(--sub);font-size:13px}
  .swatches{display:flex;gap:6px}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw.sel{border-color:var(--ink)}
  .preview-count{background:var(--chip);border-radius:6px;padding:8px 10px}
  .warn{color:var(--red);font-size:12px}
  .panel footer{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line2)}
  .panel footer .sp{flex:1}
  .disabled-zone{opacity:.45;pointer-events:none}

  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;max-width:calc(100vw - 24px);background:#2f2f2c;color:#fff;border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;z-index:40;font-size:13px}
  .toast button{border-color:#777;color:#fff;padding:1px 8px}
  .toast .bar{position:absolute;left:0;bottom:0;height:2px;background:#bbb;border-radius:0 0 8px 8px}

  /* 모바일 섹션 */
  .msec{border-bottom:1px solid var(--line2)}
  .msec .colhead{border:none;background:#f8f8f6}
  .msec .fold{border:none;padding:0 4px}
  .mrow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line2);background:#fff}
  .mrow .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .mrow .okbtn{min-width:44px;min-height:32px}
  .chips-scroll{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line2)}
  .chips-scroll .chip{flex:none}
  .mailview{padding:40px;color:var(--sub);text-align:center}
  .legend{max-width:1240px;margin:10px auto 0;color:var(--sub);font-size:12px}
</style>
</head>
<body>

<div class="tools" id="tools">
  <b>와이어프레임 도구</b>
  <button id="tDesk" class="on">데스크톱</button>
  <button id="tMob">휴대폰 375px</button>
  <span class="sep"></span>
  <button id="tNew">새 업무 도착 (SSE 흉내)</button>
  <button id="tFail">동기화 실패 켜기</button>
  <button id="tMid">자정 지남 (날짜 +1)</button>
  <button id="tReset">처음 상태로</button>
  <span class="sep"></span>
  <button id="tCode" class="on">위치 코드 표시</button>
</div>

<div class="frame" id="frame"></div>
<p class="legend">기준일 2026-10-24(토, KST) · 더미 업무 14건 · 저충실도(색은 기한 배지 의미 색만). 위치 코드는 <code>docs/wireframe.md</code> 11절과 같다. 브라우저 저장소를 쓰지 않아 새로고침하면 처음 상태로 돌아간다.</p>

<script>
(function(){
'use strict';
const TYPES=['회신','요청','검토','공지','기타'];
const DUE=[['overdue','기한 지남'],['today','오늘'],['within_3d','3일 내'],['later','이후'],['none','기한 없음']];
const GRADES=['상급자','대상자'];
const ACCOUNTS=['전체','account-a@…','account-b@…'];
const COLORS=['#888888','#c8372d','#d98a00','#2f7d4f','#2f63b8','#7a5cff'];
const MAX_COLS=7;
const TOAST_MS=5000; // S1 M6 초안과 같은 값(wireframe 8절 #5)

const BASE_TASKS=[
 {id:1,type:'요청',title:'견적서 회신 요청 (A사 3차 견적)',sender:'김OO',grade:'상급자',due:'2026-10-23',acc:'account-a@…'},
 {id:2,type:'회신',title:'주간 회의록 확인 부탁드립니다',sender:'이OO',grade:'일반',due:'2026-10-22',acc:'account-a@…'},
 {id:3,type:'검토',title:'계약서 검토 건 — 수정본 첨부',sender:'박OO',grade:'대상자',important:true,due:'2026-10-24',acc:'account-a@…'},
 {id:4,type:'요청',title:'예산 집행 내역 오늘까지 제출',sender:'김OO',grade:'상급자',due:'2026-10-24',acc:'account-a@…'},
 {id:5,type:'회신',title:'워크숍 참석 여부 회신',sender:'정OO',grade:'일반',due:'2026-10-24',acc:'account-b@…'},
 {id:6,type:'요청',title:'고객사 장애 보고서 초안 공유 요청',sender:'Lee J.',grade:'일반',due:'2026-10-24',acc:'account-a@…'},
 {id:7,type:'회신',title:'다음 주 일정 확인',sender:'최OO',grade:'일반',due:'2026-10-26',acc:'account-a@…'},
 {id:8,type:'검토',title:'제안서 목차 검토',sender:'박OO',grade:'대상자',due:'2026-10-27',acc:'account-a@…'},
 {id:9,type:'요청',title:'교육 수료증 제출',sender:'인사팀',grade:'일반',due:'2026-10-25',acc:'account-b@…'},
 {id:10,type:'검토',title:'협력사 단가표 검토',sender:'윤OO',grade:'일반',due:'2026-10-27',acc:'account-a@…'},
 {id:11,type:'요청',title:'분기 KPI 자료 준비',sender:'김OO',grade:'상급자',due:'2026-10-26',acc:'account-a@…'},
 {id:12,type:'공지',title:'10월 보안 교육 안내',sender:'인사팀',grade:'일반',due:null,acc:'account-b@…'},
 {id:13,type:'기타',title:'외부 세미나 문의',sender:'외부',grade:'일반',due:null,acc:'account-b@…'},
 {id:14,type:'요청',title:'11월 인력 계획 의견 요청',sender:'한OO',grade:'일반',due:'2026-11-03',acc:'account-a@…'}
];
const F=(o)=>Object.assign({due:[],type:[],grade:[],acc:'전체'},o);
function baseBoards(){return [
 {id:'due',name:'기한 보드',cols:[
   {id:'c1',title:'기한 지남',color:'#c8372d',system:'overdue',filter:F({due:['overdue']}),sort:'due'},
   {id:'c2',title:'오늘',color:'#d98a00',filter:F({due:['today']}),sort:'due'},
   {id:'c3',title:'3일 내',color:'#888888',filter:F({due:['within_3d']}),sort:'due'},
   {id:'c4',title:'이후·없음',color:'#888888',filter:F({due:['later','none']}),sort:'due'},
   {id:'c5',title:'상급자',color:'#2f63b8',filter:F({grade:['상급자']}),sort:'due'}
 ]},
 {id:'type',name:'업무 보드',cols:[
   {id:'t1',title:'회신',color:'#2f7d4f',filter:F({type:['회신']}),sort:'due'},
   {id:'t2',title:'요청',color:'#2f63b8',filter:F({type:['요청']}),sort:'due'},
   {id:'t3',title:'검토',color:'#7a5cff',filter:F({type:['검토']}),sort:'due'},
   {id:'t4',title:'공지',color:'#888888',filter:F({type:['공지']}),sort:'new'}
 ]}
];}

let S;
function reset(){
  S={today:'2026-10-24',tasks:BASE_TASKS.map(t=>Object.assign({status:'open',snooze:null},t)),
     boards:baseBoards(),boardId:'due',menu:'dash',mobile:S?S.mobile:false,fail:false,
     selected:new Set(),pending:{},seen:new Set(BASE_TASKS.map(t=>t.id)),flashTask:null,flashCol:null,
     folded:new Set(),editing:null,preview:null,pop:null,toast:null,nextId:100,renaming:null};
}
const dayNum=d=>Math.round(Date.parse(d+'T00:00:00Z')/864e5);
function dueState(t){
  if(!t.due) return 'none';
  const diff=dayNum(t.due)-dayNum(S.today);
  if(diff<0) return 'overdue'; if(diff===0) return 'today'; if(diff<=3) return 'within_3d'; return 'later';
}
function dueLabel(t){
  const st=dueState(t); if(st==='none') return '기한 없음';
  const diff=dayNum(t.due)-dayNum(S.today);
  if(st==='overdue') return 'D+'+(-diff); if(st==='today') return '오늘';
  return t.due.slice(5).replace('-','/');
}
// 미룬 업무가 기한을 넘기면 미룸 해제(11-2)
function liveTasks(){
  S.tasks.forEach(t=>{ if(t.status==='snoozed' && dueState(t)==='overdue'){ t.status='open'; t.snooze=null; } });
  return S.tasks.filter(t=>t.status==='open');
}
function match(t,f){
  if(f.due.length && !f.due.includes(dueState(t))) return false;
  if(f.type.length && !f.type.includes(t.type)) return false;
  if(f.grade.length && !f.grade.includes(t.grade)) return false;
  if(f.acc && f.acc!=='전체' && t.acc!==f.acc) return false;
  return true;
}
const hasCond=f=>f.due.length||f.type.length||f.grade.length||(f.acc&&f.acc!=='전체');
function sortTasks(arr,mode){
  const key=t=>t.due?dayNum(t.due):1e9;
  return arr.slice().sort((a,b)=> mode==='new'? b.id-a.id : mode==='prio'? (prio(b)-prio(a))||(key(a)-key(b)) : (key(a)-key(b))||(a.id-b.id));
}
const prio=t=>(t.grade==='상급자'?3:0)+(t.grade==='대상자'?2:0)+(t.important?1:0)+(dueState(t)==='overdue'?3:dueState(t)==='today'?2:0);
function board(){return S.boards.find(b=>b.id===S.boardId);}
function compute(){
  const all=liveTasks(); const live=all.filter(t=>S.seen.has(t.id)); const b=board(); const covered=new Set();
  const cols=b.cols.filter(c=>!c.hidden).map(c=>{
    const items=sortTasks(live.filter(t=>match(t,c.filter)),c.sort); items.forEach(t=>covered.add(t.id));
    return {c,items};
  });
  const uns=live.filter(t=>!covered.has(t.id));
  cols.push({c:{id:'uns',title:'미분류',color:'#bbbbbb',system:'unsorted',filter:F({}),sort:'due'},items:sortTasks(uns,'due')});
  // 요약 띠는 아직 칸에 반영 전인 새 업무까지 중복 없이 센다
  return {live,all,cols,
    overdue:all.filter(t=>dueState(t)==='overdue').length,
    today:all.filter(t=>dueState(t)==='today').length,
    snoozed:S.tasks.filter(t=>t.status==='snoozed').length, uns:uns.length};
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const code=c=>`<span class="code">${c}</span>`;
const frame=document.getElementById('frame');

function render(){
  frame.className='frame'+(S.mobile?' mobile':'')+(S.selected.size?' bulkmode':'');
  const d=compute();
  let h=`<div class="top">${code('T0')}<span class="app">${S.mobile?'':'미처리 메일'}</span>
    <nav class="menu"><button data-act="menu" data-v="dash" class="${S.menu==='dash'?'sel':''}">대시보드</button><button data-act="menu" data-v="mail" class="${S.menu==='mail'?'sel':''}">메일</button></nav>
    <span class="right">${S.fail?'<span style="color:var(--red)">⚠ 동기화 실패</span>':(S.mobile?'':'15:40')} <button class="ghost" title="새로고침">⟳</button> <button class="ghost" title="설정">⚙</button></span></div>`;
  if(S.menu==='mail'){
    h+=`<div class="mailview">${code('S1')} 메일 메뉴 = 기존 3단 메인(분류 · 목록 · 미리보기).<br>wireframe.md 2절 · ui_refrence/wireframe_example.html 참고</div>`;
    frame.innerHTML=h; return;
  }
  // D1 / D5
  const chips=[['총','미처리',d.all.length,'total'],['c-overdue','기한 지남',d.overdue,'red'],['c-today','오늘',d.today,''],['snz','미룸',d.snoozed,''],['uns','미분류',d.uns,'']];
  const chipHtml=chips.map(([k,l,n,cls])=>`<button class="chip ${cls}" data-act="chip" data-v="${k}">${l}<strong>${n}</strong></button>`).join('');
  if(S.selected.size){
    h+=`<div class="summary bulk">${code('D5')}<strong>${S.selected.size}개 선택됨</strong>
      <button class="fill" data-act="bulkDone">✓ 모두 완료</button><button data-act="bulkSnooze">⏰ 나중에</button>
      <span class="right"><button data-act="bulkCancel">취소</button></span></div>`;
  } else if(S.mobile){
    h+=`<div class="summary">${code('D1')}<span>미처리 <strong>${d.all.length}</strong> · 미룸 ${d.snoozed}</span></div>
      <div class="chips-scroll">${chipHtml.split('</button>').filter(x=>x&&!x.includes('chip total')).map(x=>x+'</button>').join('')}</div>
      <div class="summary">${boardSelect()}<span class="right">${addBtn(d)}</span></div>`;
  } else {
    h+=`<div class="summary">${code('D1')}${chipHtml}<span class="right">${code('D1-r')}${boardSelect()}${addBtn(d)}</span></div>`;
  }
  h+= S.mobile? mobileBoard(d) : deskBoard(d);
  h+=editPanel(d)+previewPanel();
  if(S.toast) h+=`<div class="toast" role="status" aria-live="polite">${code('D6')}${esc(S.toast.msg)} ${S.toast.undo?'<button data-act="undo">되돌리기</button>':''}<button class="ghost" data-act="toastX" style="border:none">✕</button></div>`;
  if(S.pop) h+=S.pop.html;
  frame.innerHTML=h;

function emptyHtml(c,items){

  return everHad? `<div class="empty">${code('D9')}✓ 모두 처리했어요</div>`
                : `<div class="empty">${code('D9')}조건에 맞는 업무 없음<br><br><button data-act="edit" data-col="${c.id}">필터 수정</button></div>`;

function deskBoard(d){
  let h=`<div class="board">${code('D2')}`;

      ${thin?'':`<div class="cards">${items.map(t=>card(t,c.id)).join('')}${emptyHtml(c,items)}</div>`}</section>`;

let toastTimer=null;
function toast(msg,undo){clearTimeout(toastTimer); S.toast={msg,undo}; toastTimer=setTimeout(()=>{S.toast=null;render();},TOAST_MS);}
function flashTask(id){S.flashTask=id; setTimeout(()=>{if(S.flashTask===id){S.flashTask=null;render();}},2000);}
function flashCol(id){S.flashCol=id; setTimeout(()=>{if(S.flashCol===id){S.flashCol=null;render();}},1000);}
function finish(ids,how){
  const before=ids.map(id=>{const t=S.tasks.find(x=>x.id===id); return {t,status:t.status,snooze:t.snooze};});
  ids.forEach(id=>frame.querySelectorAll(`[data-task="${id}"].card`).forEach(el=>el.classList.add('gone')));
  setTimeout(()=>{
    before.forEach(b=>{b.t.status=how; if(how==='snoozed') b.t.snooze='내일 오전';});
    S.selected.clear(); if(S.preview&&ids.includes(S.preview)) S.preview=null;
    const label= how==='done'? (ids.length>1?`${ids.length}건 처리됨`:'처리됨') : (ids.length>1?`${ids.length}건 미룸 · 내일 오전`:'미룸 · 내일 오전');
    toast(label,()=>{before.forEach(b=>{b.t.status=b.status;b.t.snooze=b.snooze;}); if(ids.length===1) flashTask(ids[0]);});
    render();
  },350);
}
function openPop(btn,html){
  const r=btn.getBoundingClientRect(), fr=frame.getBoundingClientRect();
  S.pop={html:`<div class="menu-pop">${html}</div>`,x:Math.min(r.left-fr.left,fr.width-170),y:r.bottom-fr.top+4};
}
function colById(id){return board().cols.find(c=>c.id===id);}
function scrollToCol(id){
  const box=frame.querySelector(`[data-colbox="${id}"]`); if(!box) return;
  const brd=frame.querySelector('.board');
  if(brd){ brd.scrollTo({left:Math.max(0,box.offsetLeft-brd.offsetLeft-(brd.clientWidth-box.offsetWidth)/2),behavior:'smooth'}); }
  else box.scrollIntoView({behavior:'smooth',block:'start'});
  frame.scrollLeft=0;
}

frame.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(S.pop && !(el&&el.closest('.menu-pop'))){S.pop=null; if(!el){render();return;}}
  if(!el) return;
  const a=el.dataset.act, tid=+el.dataset.task, cid=el.dataset.col;
  switch(a){
    case 'menu': S.menu=el.dataset.v; break;
    case 'chip': {
      const v=el.dataset.v; let target=null; const d=compute();
      if(v==='snz'){ const list=S.tasks.filter(t=>t.status==='snoozed');
        openPop(el,list.length?list.map(t=>`<button data-act="unsnooze" data-task="${t.id}">⏰ ${esc(t.title.slice(0,16))}… · 지금 다시 보기</button>`).join(''):'<button disabled>미룬 업무 없음</button>'); break; }
      if(v==='uns') target='uns';
      if(v==='c-overdue') target=(d.cols.find(x=>x.c.filter.due.length===1&&x.c.filter.due[0]==='overdue')||{c:{}}).c.id;
      if(v==='c-today') target=(d.cols.find(x=>x.c.filter.due.length===1&&x.c.filter.due[0]==='today')||{c:{}}).c.id;
      if(target){ S.folded.delete(target); flashCol(target); render(); scrollToCol(target); return; }
      if(v!=='총') toast('이 보드에는 해당 칸이 없습니다 — 요약 숫자는 그대로 셉니다',null);
      break; }
    case 'board': return;
    case 'addCol':
      if(board().cols.length+1>=MAX_COLS){ toast(`칸은 ${MAX_COLS}개까지(시스템 칸 포함)`,null); break; }
      S.editing={isNew:true,title:'',color:COLORS[4],filter:F({}),sort:'due'}; S.preview=null; break;
    case 'more': {
      const c=cid==='uns'?{system:'unsorted'}:colById(cid); const sys=!!c.system; const i=board().cols.indexOf(c);
      openPop(el,`<button data-act="edit" data-col="${cid}" ${cid==='uns'?'disabled':''}>편집</button>
        <button data-act="move" data-col="${cid}" data-v="-1" ${sys||i<=0?'disabled':''}>왼쪽으로</button>
        <button data-act="move" data-col="${cid}" data-v="1" ${sys||i>=board().cols.length-1?'disabled':''}>오른쪽으로</button>
        <button data-act="hide" data-col="${cid}" ${sys?'disabled':''}>숨기기${sys?' (불가)':''}</button>
        <button data-act="delColQuick" data-col="${cid}" ${sys?'disabled':''}>삭제${sys?' (불가)':''}</button>
        ${board().cols.some(x=>x.hidden)?'<button data-act="unhide">숨긴 칸 다시 보기</button>':''}`); break; }
    case 'edit': { S.pop=null; const c=colById(cid); if(!c) break;
      S.editing={id:c.id,title:c.title,color:c.color,system:c.system,filter:JSON.parse(JSON.stringify(c.filter)),sort:c.sort}; S.preview=null; break; }
    case 'move': { const cols=board().cols; const i=cols.findIndex(c=>c.id===cid); const j=i+(+el.dataset.v);
      if(j>=0&&j<cols.length&&!cols[j].system){[cols[i],cols[j]]=[cols[j],cols[i]];} S.pop=null; break; }
    case 'hide': { colById(cid).hidden=true; S.pop=null; toast('칸을 숨겼습니다 — 그 칸에만 있던 업무는 미분류로 갑니다',()=>{colById(cid).hidden=false;}); break; }
    case 'unhide': board().cols.forEach(c=>c.hidden=false); S.pop=null; break;
    case 'delColQuick': case 'delCol': { const id=cid||S.editing.id; const cols=board().cols; const i=cols.findIndex(c=>c.id===id); const removed=cols.splice(i,1)[0];
      S.pop=null; S.editing=null; toast('칸을 삭제했습니다',()=>{cols.splice(i,0,removed);}); break; }
    case 'rename': if(!colById(cid)&&cid!=='uns') break; S.renaming=cid==='uns'?null:cid; if(cid==='uns') toast('미분류 칸 이름은 고정',null); break;
    case 'fold': S.folded.has(cid)?S.folded.delete(cid):S.folded.add(cid); if(cid==='c1'&&S.boardId==='due'){S.folded.delete(cid); toast('기한 지남 섹션은 접을 수 없습니다',null);} break;
    case 'showNew': { const ids=S.pending[cid+'_ids']||[]; ids.forEach(id=>S.seen.add(id));
      // 같은 업무가 다른 칸에서도 기다리고 있으면 함께 반영(중복 표시 규칙)
      Object.keys(S.pending).filter(k=>k.endsWith('_ids')).forEach(k=>{const base=k.slice(0,-4); S.pending[k]=S.pending[k].filter(x=>!ids.includes(x)); S.pending[base]=S.pending[k].length; if(!S.pending[base]){delete S.pending[base]; delete S.pending[k];}});
      if(ids[0]) flashTask(ids[0]); break; }
    case 'sel': S.selected.has(tid)?S.selected.delete(tid):S.selected.add(tid); break;
    case 'selAll': { const d=compute(); const col=d.cols.find(x=>x.c.id===cid); const all=col.items.every(t=>S.selected.has(t.id));
      col.items.forEach(t=>all?S.selected.delete(t.id):S.selected.add(t.id)); break; }
    case 'bulkCancel': S.selected.clear(); break;
    case 'bulkDone': finish([...S.selected],'done'); return;
    case 'bulkSnooze': finish([...S.selected],'snoozed'); return;
    case 'done': finish([tid],'done'); return;
    case 'snooze': openPop(el,['오늘 오후','내일 오전','다음 주 월요일','날짜 선택…'].map(l=>`<button data-act="snoozeGo" data-task="${tid}">${l}</button>`).join('')); break;
    case 'snoozeGo': S.pop=null; finish([tid],'snoozed'); return;
    case 'unsnooze': { const t=S.tasks.find(x=>x.id===tid); t.status='open'; t.snooze=null; S.pop=null; flashTask(tid); break; }
    case 'open': toast('원문 메일을 새 탭으로 엽니다 (와이어프레임에서는 열지 않음)',null); break;
    case 'preview': S.preview=tid; S.editing=null; break;
    case 'closePrev': S.preview=null; break;
    case 'closeEdit': S.editing=null; break;
    case 'ecolor': S.editing.color=el.dataset.v; break;
    case 'ef': { const g=S.editing.filter[el.dataset.g]; const v=el.dataset.v; const k=g.indexOf(v); k<0?g.push(v):g.splice(k,1); break; }
    case 'esort': S.editing.sort=el.dataset.v; break;
    case 'saveCol': { const e=S.editing; const title=(frame.querySelector('#eTitle').value||'').trim()||'새 칸';
      if(e.isNew){ const id='u'+(S.nextId++); const cols=board().cols; cols.push({id,title,color:e.color,filter:e.filter,sort:e.sort}); S.editing=null; flashCol(id);
        toast(`칸 '${title}'을 추가했습니다`,null); render(); scrollToCol(id); return; }
      const c=colById(e.id); c.title=title; c.color=e.color; if(!c.system){c.filter=e.filter; c.sort=e.sort;} S.editing=null; flashCol(c.id); break; }
    case 'undo': if(S.toast&&S.toast.undo){S.toast.undo();} S.toast=null; clearTimeout(toastTimer); break;
    case 'toastX': S.toast=null; break;
    case 'retry': S.fail=false; syncTools(); break;
  }
  render();
});
frame.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.act==='board'){S.boardId=el.value; S.selected.clear(); S.pending={}; render();}
  if(el.dataset.act==='eacc'){S.editing.filter.acc=el.value; render();}
});
frame.addEventListener('input',ev=>{ if(ev.target.id==='eTitle') S.editing.title=ev.target.value; });

$('tNew').onclick=()=>{
  const id=S.nextId++;
  const t={id,type:'요청',title:'긴급: 고객 미팅 자료 오늘 중 공유 부탁',sender:'김OO',grade:'상급자',due:S.today,acc:'account-a@…',status:'open',snooze:null};
  S.tasks.push(t);
  // 업무가 들어갈 칸 중 이미 카드가 있는 칸은 '+N 새 항목', 빈 칸이면 바로 넣기(11-2)
  const d=compute(); let anyEmpty=false;
  board().cols.filter(c=>!c.hidden&&match(t,c.filter)).forEach(c=>{
    const col=d.cols.find(x=>x.c.id===c.id);
    if(col.items.length){ S.pending[c.id]=(S.pending[c.id]||0)+1; (S.pending[c.id+'_ids']=S.pending[c.id+'_ids']||[]).push(id); }
    else anyEmpty=true;
  });
  if(anyEmpty || !Object.keys(S.pending).some(k=>(S.pending[k+'_ids']||[]).includes(id))){
    S.seen.add(id); flashTask(id);
    Object.keys(S.pending).filter(k=>k.endsWith('_ids')).forEach(k=>{const base=k.slice(0,-4); S.pending[k]=S.pending[k].filter(x=>x!==id); S.pending[base]=S.pending[k].length; if(!S.pending[base]){delete S.pending[base]; delete S.pending[k];}});
  }
  render();
};

window.addEventListener('resize',()=>{ if(manual) return; const m=window.innerWidth<768; if(m!==S.mobile){S.mobile=m; syncTools(); render();} });
reset(); S.mobile=window.innerWidth<768; syncTools(); render();
})();
</script>
