<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNE 화면 시안 v3.1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
<style>
/* 배치: 상단 바 + 대시보드 2열(왼쪽 340px = 받은 날 기준 건수 · 응답 대기 · 확인사항 / 오른쪽 = 긴급 + 유형 2×2)
   + 오른쪽 패널 하나(메일 480px 또는 에이전트 360px, 한 번에 하나) + 아래 시트 · 오른쪽 아래 토스트.
   색 비율: 60% 무채색 면 · 35% 보조 4색 · 5% 포인트(LG Heritage Red). 상태색은 포인트와 따로 둔다. 근거: docs/20_frontend/design_system.md */
:root{
  /* 60% 바탕 */
  --c-canvas:#F7F8F9; --c-surface:#FFFFFF;
  /* 35% 보조 4색 */
  --c-ink:#121212;      /* 보조1 본문 글자 · 진한 아이콘 18.73:1 */
  --c-gray:#6B6B6B;     /* 보조2 LG GRAY · 보조 글자 · 로고 글자 5.33:1 */
  --c-line:#E5E5E5;     /* 보조3 구분선(장식) */
  --c-fill:#F0F1F3;     /* 보조4 선택 행 · hover 면 · 칩 */
  --c-input:#8E8E8E;    /* 입력칸 테두리 3.28:1 (UI 3:1) — 글자 금지 */
  --c-sub:#565656;      /* 작은 보조 글자 7.34:1 */
  /* 5% 포인트 */
  --c-point:#A50034; --c-point-press:#610024; --c-point-soft:#F7E9EE; /* soft는 파생값 */
  /* 상태색 (LG CNS 사이트 팔레트) — 옅은 바탕 + 아이콘 + 글자로만 쓴다 */
  --c-danger:#B20C00; --c-danger-bg:#FFE4E0;
  --c-warn:#773100;   --c-warn-bg:#F9F5B9;
  --c-ok:#004121;     --c-ok-bg:#D4F5C7; --c-ok-icon:#209359;
  --c-info:#003374;   --c-info-bg:#DDF3FB; --c-info-icon:#0755B9;
  --c-scrim:rgba(18,18,18,.32);
  /* 서체 */
  --f-ko:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-en:"Outfit",var(--f-ko);
  /* 크기 */
  --t-12:12px; --t-13:13px; --t-14:14px; --t-16:16px; --t-20:20px; --t-28:28px; --t-40:40px;
  --r-ctl:8px; --r-card:12px; --r-sheet:16px;
  --shadow-1:0 1px 2px rgba(18,18,18,.05),0 1px 6px rgba(18,18,18,.04);
  --shadow-2:0 8px 28px rgba(18,18,18,.14),0 2px 6px rgba(18,18,18,.06);
  /* 움직임 */
  --d-fast:100ms; --d-short:150ms; --d-move:250ms; --d-panel:300ms;
  --e-std:cubic-bezier(.2,0,0,1); --e-in:cubic-bezier(.05,.7,.1,1); --e-out:cubic-bezier(.3,0,.8,.15);
  --top-h:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--c-canvas);color:var(--c-ink);font:400 var(--t-14)/1.5 var(--f-ko);-webkit-font-smoothing:antialiased;font-feature-settings:"ss06"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--c-surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-en);font-variant-numeric:tabular-nums}

/* ── 상단 바 T0 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:var(--top-h);background:var(--c-surface);border-bottom:1px solid var(--c-line);
  display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo-slot{display:flex;align-items:center;justify-content:center;height:28px;padding:0 8px;border:1px dashed var(--c-input);border-radius:6px;font-size:11px;color:var(--c-gray);white-space:nowrap}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:700 22px/1 var(--f-en);letter-spacing:.02em}
.brand span{font:500 12px/1 var(--f-en);color:var(--c-gray);letter-spacing:.06em;text-transform:uppercase}
.top .grow{flex:1}
.nav{display:flex;gap:4px;height:100%}
.nav button{border:0;background:none;padding:0 12px;height:100%;font-weight:500;color:var(--c-sub);border-bottom:2px solid transparent}
.nav button[aria-current="page"]{color:var(--c-ink);font-weight:700;border-bottom-color:var(--c-point)}
.sync{font-size:var(--t-12);color:var(--c-gray);white-space:nowrap}
.icon-btn{position:relative;width:40px;height:40px;border-radius:var(--r-ctl);border:0;background:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--c-fill)}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c-ink);color:#fff;font:600 11px/18px var(--f-en);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--c-input);background:var(--c-surface);font-weight:600;font-size:var(--t-14);white-space:nowrap;position:relative;transition:background var(--d-short) var(--e-std),border-color var(--d-short) var(--e-std)}
.btn:hover{background:var(--c-fill)}
.btn.primary{background:var(--c-point);border-color:var(--c-point);color:#fff}
.btn.primary:hover{background:#8C002C}
.btn.primary:active{background:var(--c-point-press)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--c-fill)}
.btn.sm{height:30px;padding:0 10px;font-size:var(--t-13)}
.btn[aria-disabled="true"]{cursor:default}
.agent-btn{height:38px;padding:0 16px;border-radius:19px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--c-fill);display:grid;place-items:center;font-weight:700;font-size:13px}

/* ── 본문 ── */
.app{padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:padding-right var(--d-panel) var(--e-std)}
@media (min-width:1280px){ body.panel-mail .app{padding-right:calc(480px + 20px)} body.panel-agent .app{padding-right:calc(360px + 20px)} }
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;max-width:1440px;margin-inline:auto}
.page-head h1{margin:0;font-size:var(--t-20);font-weight:700;text-wrap:balance}
.page-head p{margin:2px 0 0;color:var(--c-gray);font-size:var(--t-13)}
.alert{max-width:1440px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-ctl);background:var(--c-danger-bg);color:var(--c-danger);font-weight:600}
.alert .btn{margin-left:auto;border-color:transparent;background:var(--c-surface);color:var(--c-ink)}
.dash{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1023px){.dash{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-card);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.card-h h2{margin:0;font-size:var(--t-14);font-weight:700}
.card-h .count{font:600 var(--t-14)/1 var(--f-en);color:var(--c-gray)}
.card-h .tools{margin-left:auto;display:flex;gap:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--c-gray)}

/* 1열 · 받은 날 기준 업무 수 */
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--c-fill);gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:7px;font-size:var(--t-13);font-weight:500;color:var(--c-sub)}
.seg button[aria-pressed="true"]{background:var(--c-surface);color:var(--c-ink);font-weight:700;box-shadow:var(--shadow-1)}
.datebar{display:flex;align-items:center;gap:6px;padding:0 16px 4px}
.datebar input{height:30px;border:1px solid var(--c-input);border-radius:6px;padding:0 8px;font-size:var(--t-13);background:var(--c-surface)}
.totals{padding:6px 16px 16px}
.totals .big{display:flex;align-items:baseline;gap:8px}
.totals .big strong{font:600 var(--t-40)/1 var(--f-en);letter-spacing:-.01em}
.totals .big span{color:var(--c-gray)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.split div{padding:10px 12px;border-radius:var(--r-ctl);background:var(--c-canvas)}
.split dt{font-size:var(--t-12);color:var(--c-sub)}
.split dd{margin:2px 0 0;font:600 var(--t-20)/1.2 var(--f-en)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--c-fill);margin-top:12px}
.bar i{display:block;background:var(--c-ok-icon);transition:width var(--d-move) var(--e-std)}
.foot-note{font-size:var(--t-12);color:var(--c-gray);margin-top:8px}

/* 응답 대기 */
.wait-list{list-style:none;margin:0;padding:0 8px 10px}
.wait-list li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-ctl)}
.wait-list li:hover{background:var(--c-canvas)}
.wait-list .who{font-size:var(--t-12);color:var(--c-gray)}
.days{margin-left:auto;font:600 var(--t-13)/1 var(--f-en);color:var(--c-sub);background:var(--c-fill);padding:4px 8px;border-radius:6px;white-space:nowrap}

/* 확인사항 */
.info-tabs{padding:0 16px 8px}
.info-list{list-style:none;margin:0;padding:0 8px 6px}
.info-list li button{width:100%;text-align:left;border:0;background:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px;border-radius:var(--r-ctl)}
.info-list li button:hover{background:var(--c-canvas)}
.info-list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.info-list .m{grid-column:2/4;font-size:var(--t-12);color:var(--c-gray)}
.info-list .when{font-size:var(--t-12);color:var(--c-gray)}
.info-list li.seen .t{color:var(--c-gray);font-weight:400}
.reason{font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--c-info-bg);color:var(--c-info);white-space:nowrap}
.reason.ref{background:var(--c-fill);color:var(--c-sub)}
.more-row{display:flex;gap:4px;padding:0 8px 10px}
.more-row .btn{flex:1}

/* 2열 · 긴급 + 유형 */
.lane-urgent .card-h h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-ink);margin-right:8px;vertical-align:1px}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.types{grid-template-columns:minmax(0,1fr)}}
.rows{list-style:none;margin:0;padding:0 6px 6px}
.row{display:grid;grid-template-rows:1fr;transition:grid-template-rows 200ms var(--e-std) 250ms}
.row > div{overflow:hidden;min-height:0}
.row-in{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-ctl);transition:transform var(--d-move) var(--e-out),opacity var(--d-move) var(--e-out),background var(--d-fast)}
.row-in:hover{background:var(--c-canvas)}
.row.sel .row-in{background:var(--c-fill)}
.row.leaving{grid-template-rows:0fr}
.row.leaving .row-in{transform:translateX(28px);opacity:0}
.row .txt{min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:1px}
.row .txt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt small{font-size:var(--t-12);color:var(--c-gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .new{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c-info-icon);margin-left:6px;vertical-align:2px}
.chip{font-size:var(--t-12);font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap;background:var(--c-fill);color:var(--c-sub)}
.chip.hot{background:var(--c-ink);color:#fff;font-family:var(--f-en);letter-spacing:.02em}   /* 기한 지남 · ASAP = 검정 */
.chip.today{background:var(--c-info-bg);color:var(--c-info)}                               /* 오늘까지 = 파랑 */
.chip.due{background:var(--c-ok-bg);color:var(--c-ok)}                                    /* 기한 남음 = 초록 */
.chip.type{background:none;border:1px solid var(--c-line);color:var(--c-sub);font-weight:500}
.empty{padding:6px 16px 14px;color:var(--c-gray);font-size:var(--t-13)}
.expand{display:block;width:calc(100% - 12px);margin:0 6px 8px;border:0;background:none;text-align:left;padding:6px 10px;border-radius:6px;color:var(--c-sub);font-size:var(--t-13);font-weight:600}
.expand:hover{background:var(--c-canvas)}

/* 체크 상자 — 완료 모핑 */
.ck{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--c-input);background:var(--c-surface);display:grid;place-items:center;cursor:pointer;transition:background var(--d-short) var(--e-std),border-color var(--d-short) var(--e-std),transform var(--d-fast)}
.ck:active{transform:scale(.9)}
.ck::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transform-origin:center;margin-top:-2px;transition:transform var(--d-short) var(--e-in)}
.ck:checked{background:var(--c-ink);border-color:var(--c-ink)}
.ck:checked::after{transform:rotate(-45deg) scale(1)}

/* 스켈레톤 · 상태 */
.skel{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--c-fill),#F7F8F9,var(--c-fill));background-size:200% 100%;animation:sh 1.2s linear infinite;margin:12px 16px}
@keyframes sh{to{background-position:-200% 0}}
.state-box{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 16px 16px;font-size:var(--t-13);color:var(--c-sub)}
.state-box strong{color:var(--c-ink);font-size:var(--t-14)}
.pending-note{display:flex;gap:10px;align-items:flex-start;margin:0 16px 14px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--c-info-bg);color:var(--c-info);font-size:var(--t-13)}

/* ── 오른쪽 패널 (메일 M · 에이전트 G) ── */
.panel{position:fixed;top:calc(var(--top-h) + env(safe-area-inset-top,0px));right:0;bottom:0;z-index:30;background:var(--c-surface);border-left:1px solid var(--c-line);box-shadow:var(--shadow-2);display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;transition:transform var(--d-panel) var(--e-std),visibility 0s linear var(--d-panel);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none;visibility:visible;transition:transform var(--d-panel) var(--e-in),visibility 0s}
#listPanel{width:480px} #agentPanel{width:360px}
@media (max-width:720px){#listPanel,#agentPanel{width:100%}}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--c-line)}
.panel-h h2{margin:0;font-size:var(--t-16);font-weight:700;flex:1;min-width:0}
.panel-b{flex:1;overflow:auto;padding:16px 18px}
.mail-meta{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.mail-meta h3{margin:0 0 6px;font-size:var(--t-16);line-height:1.4;text-wrap:balance}
.mail-meta span{font-size:var(--t-13);color:var(--c-sub)}
.found{border:1px solid var(--c-line);border-radius:var(--r-card);padding:4px 6px 6px;margin-bottom:16px}
.found .eyebrow{display:block;padding:8px 10px 2px}
.body-text p{margin:0 0 10px;line-height:1.7}
mark{background:#FFF3A8;color:inherit;padding:1px 2px;border-radius:3px}
.panel-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--c-line)}
.menu{position:absolute;z-index:70;min-width:180px;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-ctl);box-shadow:var(--shadow-2);padding:4px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--c-fill)}

/* 답장 작성 — 템플릿 */
.composer{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:var(--t-12);font-weight:600;color:var(--c-sub);margin-bottom:6px}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
.tpl button{border:1px solid var(--c-line);background:var(--c-surface);border-radius:16px;height:30px;padding:0 12px;font-size:var(--t-13)}
.tpl button[aria-pressed="true"]{border-color:var(--c-ink);background:var(--c-ink);color:#fff;font-weight:600}
.composer textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--c-input);border-radius:var(--r-ctl);padding:10px 12px;line-height:1.6;background:var(--c-surface)}
.preview{border:1px solid var(--c-line);border-radius:var(--r-card);background:var(--c-canvas);padding:12px 14px;font-size:var(--t-13);line-height:1.7;white-space:pre-wrap}
.preview .subj{display:block;font-weight:700;margin-bottom:8px;white-space:normal}
.preview .user{background:var(--c-surface);border-bottom:2px solid var(--c-ink)}
.hint{font-size:var(--t-12);color:var(--c-gray)}

/* 버튼 모핑 — 보내기 → 보내는 중 → 보냄 ✓ */
.morph .lbl{transition:opacity var(--d-short) var(--e-std)}
.morph .ov{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity var(--d-short) var(--e-std)}
.morph[data-state="busy"] .lbl,.morph[data-state="done"] .lbl{opacity:0}
.morph[data-state="busy"] .ov,.morph[data-state="done"] .ov{opacity:1}
.morph[data-state="done"]{background:var(--c-ok-icon);border-color:var(--c-ok-icon)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── 에이전트 ── */
.ag-body{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px}
.ag-intro{font-size:var(--t-13);color:var(--c-sub)}
.ex{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ex button{text-align:left;border:1px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-ctl);padding:8px 10px;font-size:var(--t-13)}
.ex button:hover{background:var(--c-canvas)}
.bubble{align-self:flex-end;max-width:85%;background:var(--c-fill);border-radius:12px 12px 4px 12px;padding:8px 12px}
.run{border:1px solid var(--c-line);border-radius:var(--r-card);overflow:hidden}
.run-h{display:flex;align-items:center;gap:6px;background:var(--c-canvas);padding:4px 6px 4px 4px}
.run-tg{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px;border-radius:6px;text-align:left;font-size:var(--t-13)}
.run-tg:hover{background:var(--c-fill)}
.run-h .lab{flex:1;min-width:0;font-weight:600}
.run-h .meta{font:500 var(--t-12)/1 var(--f-en);color:var(--c-gray);white-space:nowrap}
.run-h .caret{transition:transform var(--d-short)}
.run[data-open="true"] .run-tg .caret{transform:rotate(180deg)}

/* ── 알림 센터 ── */
.pop{position:fixed;z-index:50;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 6px);right:max(12px,env(safe-area-inset-right,0px));width:400px;max-width:calc(100vw - 24px);max-height:min(620px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-card);box-shadow:var(--shadow-2);
  opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;visibility:hidden;transition:opacity var(--d-short) var(--e-std),transform var(--d-short) var(--e-std),visibility 0s linear var(--d-short)}

/* ── 토스트 ── */
.toasts{position:fixed;z-index:80;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}

kbd{margin-left:auto;font:500 11px/1 var(--f-en);color:var(--c-gray);border:1px solid var(--c-line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;background:var(--c-canvas)}
.m-list{border-right:1px solid var(--c-line)}

@media (max-width:1023px){.mail3,.mail3.nav-off{grid-template-columns:minmax(0,1fr);height:auto}.m-nav{border-right:0;border-bottom:1px solid var(--c-line)}.m-view{border-top:1px solid var(--c-line)}}

<body>

<script>
/* ───────── 시연 데이터 (가상 인물 · 가상 메일. 기준 시각 2026-11-06(금) 10:42 KST) ───────── */
const TODAY='2026-11-06', NOW_T='10:42', ME='이준호';
const WEEK=['일','월','화','수','목','금','토'];
const DATES={'2026-11-02':1,'2026-11-03':2,'2026-11-04':3,'2026-11-05':4,'2026-11-06':5,'2026-11-07':6,'2026-11-09':1,'2026-11-10':2,'2026-11-11':3,'2026-11-12':4,'2026-11-13':5};
const md=d=>{const [,m,dd]=d.split('-');return `${+m}/${+dd}(${WEEK[DATES[d]]})`};

const mails=[
 {id:'m1',from:'이서준',title:'책임 · 보안팀',sup:true,subject:'[요청] 1팀 보안 점검 결과 회신 부탁드립니다',time:'11/3 14:20',date:'2026-11-03',cat:'회신',lane:'할 일',acc:'사내',
  body:['이준호 팀장님, 안녕하세요. 보안팀 이서준입니다.','지난주 진행한 1팀 보안 점검 결과서를 첨부드립니다.','<mark>점검 결과에 대한 조치 계획을 11/4(수)까지 회신 부탁드립니다.</mark>','감사합니다.']},

/* ───────── 완료 · 되돌리기 ───────── */
let lastAction=null;
function completeTasks(ids,src,{animate=true,toastMsg}={}){
  const before=ids.map(id=>({id,status:taskById(id).status}));
  const apply=()=>{ ids.forEach(id=>{const t=taskById(id); t.status='done'; t.isNew=false}); const act={ids,before,src}; lastAction=act; render(); refreshMailPanel();
    toast(toastMsg||(ids.length===1?`'${taskById(ids[0]).text}' 완료로 바꿨어요`:`${ids.length}건을 완료로 바꿨어요`),{undo:()=>undo(act)}); };
  if(!animate) return apply();
  const rows=[...document.querySelectorAll(ids.map(id=>`.row[data-task="${id}"]`).join(','))];
  rows.forEach(r=>{const c=r.querySelector('.ck'); if(c) c.checked=true;});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>rows.forEach(r=>r.classList.add('leaving')),reduce?0:180);
  setTimeout(apply,reduce?0:650);
}
function undo(act){
  if(!act) return;
  act.before.forEach(b=>{taskById(b.id).status=b.status; if(b.until) taskById(b.id).until=undefined});
  if(lastAction===act) lastAction=null;
  render(); refreshMailPanel(); toast('되돌렸어요');
}
function setStatus(ids,status,msg){
  const before=ids.map(id=>({id,status:taskById(id).status}));
  ids.forEach(id=>taskById(id).status=status);
  const act={ids,before}; lastAction=act; render(); refreshMailPanel(); toast(msg,{undo:()=>undo(act)});
  return act;
}

/* ───────── 토스트 ───────── */
function toast(msg,{undo:onUndo,rem}={}){
  const box=$('#toasts'); while(box.children.length>=3) box.firstElementChild.remove();
  const el=document.createElement('div'); el.className='toast'+(rem?' rem':'');
  if(rem){ el.innerHTML=rem; }
  else el.innerHTML=`<span class="msg">${msg}</span>${onUndo?'<button class="btn">되돌리기</button>':''}<button class="x" aria-label="닫기">✕</button>`;
  box.appendChild(el);
  const auto=!rem; let left=onUndo?8000:5000, timer=null, start=Date.now();
  const bye=()=>{el.classList.add('bye'); setTimeout(()=>el.remove(),160)};
  const run=()=>{ if(!auto) return; start=Date.now(); timer=setTimeout(bye,Math.max(left,1500))};
  el.addEventListener('mouseenter',()=>{clearTimeout(timer); left-=Date.now()-start});
  el.addEventListener('mouseleave',run);
  el.addEventListener('focusin',()=>clearTimeout(timer));
  const ub=el.querySelector('.btn:not([data-rem])'); if(ub&&onUndo) ub.onclick=()=>{onUndo(); bye()};
  el.querySelectorAll('.x').forEach(x=>x.onclick=bye);
  run(); return el;
}

/* ───────── 에이전트 ───────── */
let run=null;
const STEP_NAMES={understand:'명령 이해',target:'대상 찾기',confirm:'확인',exec:'실행'};
function liveSay(s){$('#agLive').textContent=s}
function updateCtx(){ const m=S.selMail&&mailById(S.selMail); $('#agCtx').hidden=!m; if(m) $('#agCtxName').textContent=m.subject; }
function plan(text){
  const t=text.replace(/\s/g,'');
  if(/취소|되돌/.test(t)) return {id:'T04',kind:'change1',src:'규칙'};
  if(/오늘.*(뭐|할일)|요약/.test(t)) return {id:'T01',kind:'read',src:'규칙'};
  if(/김.*팀장.*(처리|완료)/.test(t)) return {id:'T03',kind:'changeN',src:'규칙'};
  if(/(금요일|다시알려|나중에)/.test(t)) return {id:'T05',kind:'change1',src:'규칙'};
  if(/답장.*안.*온|무응답|답장안온/.test(t)) return {id:'T06',kind:'read',src:'규칙'};
  if(/초안|회신.*써/.test(t)) return {id:'T07',kind:'read',src:'규칙'};
  return {id:null,kind:'unknown',src:'엑사원'};
}
function agentSubmit(text){
  text=text.trim(); if(!text) return;
  if(run&&run.state==='running') return;
  $('#agText').value='';
  const ex=document.querySelector('.ag-intro'); if(ex) ex.remove();
  const body=$('#agBody');
  body.insertAdjacentHTML('beforeend',`<div class="bubble">${text}</div>`);
  const p=plan(text);
  const steps=p.kind==='read'?['understand','target','exec']:p.kind==='unknown'?['understand','target','exec']:p.kind==='changeN'?['understand','target','confirm','exec']:['understand','target','exec'];
  const el=document.createElement('div'); el.className='run'; el.dataset.open='false';
  body.appendChild(el);
  run={el,p,steps,i:0,state:'running',t0:Date.now(),timers:[],status:steps.map(()=> 'pending'),notes:{}};
  run.tick=setInterval(drawRun,1000);
  drawRun(); advance();
}
function stepLabel(s,st){
  const ing={understand:'명령을 이해하는 중',target:'대상 업무를 찾는 중',confirm:'확인을 기다리는 중',exec:p=>p.kind==='read'?'결과를 정리하는 중':'처리하는 중'};
  if(st==='active'){const v=ing[s]; return (typeof v==='function'?v(run.p):v)+'…'}
  return STEP_NAMES[s]+(s==='exec'&&run.p.kind==='read'?' (정리)':'');
}
function drawRun(){
  if(!run) return; const r=run, sec=Math.round((Date.now()-r.t0)/1000);
  const cur=r.status.findIndex(s=>s==='active'||s==='wait'||s==='fail');
  let lab, meta, icon;
  if(r.state==='running'){ const idx=cur<0?r.i:cur; lab=r.status[idx]==='wait'?'확인을 기다리고 있어요':stepLabel(r.steps[idx],'active'); meta=`${idx+1}/${r.steps.length}${sec>=3?' · '+sec+'초':''}`; icon='<span class="dot active" aria-hidden="true"></span>'; if(r.p.src==='엑사원'&&sec>=3&&idx===0) lab='엑사원이 명령을 해석하는 중… (최대 30초)'; }
  else if(r.state==='done'){ lab=`${r.steps.filter((s,i)=>r.status[i]==='done').length}단계 완료`; meta=`${r.final}초`; icon='<span class="dot done" aria-hidden="true">✓</span>'; }
  else if(r.state==='fail'){ lab='처리하지 못했어요'; meta=`${r.final}초`; icon='<span class="dot fail" aria-hidden="true">!</span>'; }
  else { lab='중지했어요. 바뀐 것은 없어요'; meta=`${r.final}초`; icon='<span class="dot skip" aria-hidden="true"></span>'; }
  const notes={understand:`${r.p.id?r.p.id+' · ':''}<span class="src">${r.p.src}</span>`,...r.notes};
  r.el.innerHTML=`<div class="run-h"><button class="run-tg" aria-expanded="${r.el.dataset.open}">${icon}<span class="lab">${lab}</span><span class="meta">${meta}</span><svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    ${r.state==='running'?'<button class="btn sm ghost" data-stop>중지</button>':''}</div>
    <ol class="steps">${r.steps.map((s,i)=>{const st=r.status[i];return `<li class="${st==='skip'?'skip':''}"><span class="dot ${st==='pending'?'':st}" aria-hidden="true">${st==='done'?'✓':st==='fail'?'!':st==='wait'?'?':''}</span><span>${STEP_NAMES[s]}${st==='skip'?' · 건너뜀':''}<small>${notes[s]||''}</small></span></li>`}).join('')}</ol>`;
}
function later(fn,ms){run.timers.push(setTimeout(fn,matchMedia('(prefers-reduced-motion: reduce)').matches?Math.min(ms,300):ms))}
function advance(){
  const r=run, s=r.steps[r.i];
  r.status[r.i]='active'; drawRun(); liveSay(stepLabel(s,'active'));
  const dur=s==='understand'?(r.p.src==='엑사원'?4200:700):s==='target'?900:800;
  later(()=>{
    if(s==='understand'&&!r.p.id){ r.status[0]='fail'; r.notes.understand='행동 목록(T01~T14)에 없는 요청'; r.status=r.status.map((x,i)=>i?'skip':x); finish('fail'); card(`<div class="acard"><h3>지원하지 않는 요청이에요</h3><div class="hint">메일 업무를 찾고 처리하는 일만 할 수 있어요. 이렇게 말해 보세요.</div><div class="ex">${['오늘 뭐 해야 돼?','답장 안 온 메일 있어?','견적 건은 금요일에 다시 알려줘'].map(x=>`<button>${x}</button>`).join('')}</div></div>`); return; }
    if(s==='target') r.notes.target=targetNote(r.p);
    r.status[r.i]='done'; r.i++;
    if(r.i>=r.steps.length) return complete();
    if(r.steps[r.i]==='confirm'){ r.status[r.i]='wait'; drawRun(); liveSay('확인이 필요해요'); confirmCard(); return; }
    advance();
  },dur);
}
function targetNote(p){
  if(p.id==='T03') return "'김 팀장님' → 김민준 팀장 (연락처 일치) · 미처리 3건";
  if(p.id==='T05') return "'견적 건' → 3차 견적서 수정본 송부 · '금요일' → 11/13(금) 09:00";
  if(p.id==='T04') return lastAction?`마지막 행동 · ${lastAction.ids.length}건`:'되돌릴 행동 없음';
  if(p.id==='T06') return '보낸 요청 메일 중 3일 넘게 답이 없는 것 2건';
  if(p.id==='T07') return S.selMail?'선택한 메일':'선택한 메일 없음 → 가장 급한 업무의 메일';
  return '미처리 업무 '+tasks.filter(isOpen).length+'건';
}
function finish(state){ const r=run; r.state=state; r.final=Math.max(1,Math.round((Date.now()-r.t0)/1000)); clearInterval(r.tick); r.el.dataset.open=state==='fail'?'true':'false'; drawRun(); liveSay(state==='done'?'완료했어요':state==='fail'?'처리하지 못했어요':'중지했어요'); }
function card(html){ $('#agBody').insertAdjacentHTML('beforeend',html); const b=$('#agBody'); b.scrollTop=b.scrollHeight; return b.lastElementChild; }
function confirmCard(){
  const ids=tasks.filter(t=>isOpen(t)&&mailById(t.mail)&&mailById(t.mail).from==='김민준').map(t=>t.id);
  const c=card(`<div class="acard confirm" tabindex="-1"><h3>김민준 팀장님 업무 ${ids.length}건을 완료로 바꿀까요?</h3>
    <ul>${ids.map(id=>`<li><input type="checkbox" class="ck" checked value="${id}" id="cf-${id}"><label for="cf-${id}">${taskById(id).text}</label></li>`).join('')}</ul>
    <div class="hint">빼고 싶은 업무는 체크를 푸세요. 바꾼 뒤에도 되돌릴 수 있어요.</div>
    <div class="acts"><button class="btn" data-cf-no>취소</button><button class="btn primary" data-cf-yes>${ids.length}건 완료 처리</button></div></div>`);
  c.focus();
  c.querySelector('[data-cf-yes]').onclick=()=>{const sel=[...c.querySelectorAll('input:checked')].map(i=>i.value); c.remove(); if(!sel.length){run.status[run.i]='skip';finish('stopped');return} run.sel=sel; run.status[run.i]='done'; run.i++; advance();};
  c.querySelector('[data-cf-no]').onclick=()=>{c.remove(); run.status=run.status.map(x=>x==='pending'||x==='wait'?'skip':x); finish('stopped');};
  c.addEventListener('change',()=>{const n=c.querySelectorAll('input:checked').length; c.querySelector('[data-cf-yes]').textContent=`${n}건 완료 처리`;});

});
document.addEventListener('input',e=>{
  if(e.target.id==='draft'){ const u=$('#pvUser'); if(u) u.textContent=e.target.value||'(보낼 내용을 쓰세요)'; S.draft=e.target.value; }
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='b'&&S.view==='mail'){e.preventDefault(); S.navOff=!S.navOff; renderMail(); const t=$('#navToggle'); t&&t.focus(); return}
  if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!e.target.closest('input,textarea')&&!$('#sheet').open){e.preventDefault(); e.key==='ArrowLeft'?goBack():goFwd(); return}
  if(e.key==='Escape'){
    if($('#sheet').open) return;
    if(document.querySelector('.menu')){document.querySelectorAll('.menu').forEach(m=>m.remove());return}
    if($('#pop').classList.contains('open')){togglePop(false);$('#bell').focus();return}
    if(PANELS.some(p=>document.getElementById(p).classList.contains('open'))){closePanels();render();return}
  }
  if(e.target.id==='agText'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault(); agentSubmit(e.target.value)}
});
$('#agForm').addEventListener('submit',e=>{e.preventDefault(); agentSubmit($('#agText').value)});
$('#sheetYes').onclick=()=>closeSheet(true);
$('#sheetNo').onclick=()=>closeSheet(false);
$('#sheet').addEventListener('cancel',e=>{e.preventDefault(); closeSheet(false)}); /* Esc = 아니오 */
$('#sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(false) }); /* 스크림 = 아니오 */
function syncDev(){document.querySelectorAll('#devStates button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===S.uiState))}

render();
</script>
</body>
</html>
