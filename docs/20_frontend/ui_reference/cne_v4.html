<!DOCTYPE html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNE 화면 시안 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* 배치: 시안 띠 32 + 상단 바 60 + 화면별 칸(메일 220·380·나머지, 캐치봇 220·380·나머지, 설정 220·나머지). 1024px 미만은 위아래로 쌓인다.
   토큰: frontend/src/styles/tokens.css v3.3(고정) + theme.css 다크 값을 그대로 옮겼다. 새 값은 만들지 않는다. */
:root {
  --c-surface:#ffffff; --c-canvas:#f7f8f9; --c-ink:#121212; --c-gray:#6b6b6b; --c-line:#e5e5e5; --c-fill:#f0f1f3;
  --c-point:#a50034; --c-point-press:#610024; --c-sub:#565656; --c-input:#8e8e8e; --c-on-strong:#ffffff; --c-scrim:rgba(18,18,18,.32);
  --c-due-urgent-bg:#ffe4e0; --c-due-urgent-text:#b20c00; --c-due-today-bg:#d4f5c7; --c-due-today-text:#004121;
  --c-due-later-bg:#ddf3fb; --c-due-later-text:#003374; --c-due-none-bg:#f0f1f3; --c-due-none-text:#565656;
  --c-info:#003374; --c-info-bg:#ddf3fb; --c-info-dot:#0755b9; --c-done:#004121; --c-done-bg:#d4f5c7; --c-done-bar:#209359;
  --c-danger:#b20c00; --c-danger-bg:#ffe4e0; --c-remind:#773100; --c-remind-bg:#f9f5b9; --c-mark:#ffeb8a; --c-mark-line:#8e6a00; --c-mark-strong:#ffd84d;
  --font-body:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Outfit','Noto Sans KR',sans-serif;
  --r-chip:4px; --r-ctl:8px; --r-card:12px; --r-sheet:16px;
  --shadow-1:0 1px 2px rgba(18,18,18,.05),0 1px 6px rgba(18,18,18,.04);
  --shadow-2:0 8px 28px rgba(18,18,18,.14),0 2px 6px rgba(18,18,18,.06);
  --d-fast:100ms; --d-short:150ms; --d-move:250ms; --d-panel:300ms; --d-exit:200ms;
  --e-std:cubic-bezier(.2,0,0,1); --e-in:cubic-bezier(.05,.7,.1,1); --e-out:cubic-bezier(.3,0,.8,.15);
  --t-move:var(--d-short); /* 이동 · 변형 시간. 동작 줄이기면 0 */
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --c-surface:#1c1d1f; --c-canvas:#121314; --c-ink:#ececec; --c-gray:#a3a3a3; --c-line:#34363a; --c-fill:#2a2c2f;
  --c-point:#ff6b93; --c-point-press:#ff8fae; --c-sub:#a8a8a8; --c-input:#7a7a7a; --c-on-strong:#121212; --c-scrim:rgba(0,0,0,.6);
  --c-due-urgent-bg:#4a1712; --c-due-urgent-text:#ffb4a9; --c-due-today-bg:#123d21; --c-due-today-text:#b6efa0;
  --c-due-later-bg:#0f2f45; --c-due-later-text:#a8dcf5; --c-due-none-bg:#2a2c2f; --c-due-none-text:#b5b5b5;
  --c-info:#a8dcf5; --c-info-bg:#0f2f45; --c-info-dot:#6aa7ff; --c-done:#b6efa0; --c-done-bg:#123d21; --c-done-bar:#3fbf7a;
  --c-danger:#ffb4a9; --c-danger-bg:#4a1712; --c-remind:#f3d27a; --c-remind-bg:#3d3410; --c-mark:#3f3400; --c-mark-line:#e0b84a; --c-mark-strong:#5c4c00; color-scheme:dark; } }
:root[data-theme="dark"] {
  --c-surface:#1c1d1f; --c-canvas:#121314; --c-ink:#ececec; --c-gray:#a3a3a3; --c-line:#34363a; --c-fill:#2a2c2f;
  --c-point:#ff6b93; --c-point-press:#ff8fae; --c-sub:#a8a8a8; --c-input:#7a7a7a; --c-on-strong:#121212; --c-scrim:rgba(0,0,0,.6);
  --c-due-urgent-bg:#4a1712; --c-due-urgent-text:#ffb4a9; --c-due-today-bg:#123d21; --c-due-today-text:#b6efa0;
  --c-due-later-bg:#0f2f45; --c-due-later-text:#a8dcf5; --c-due-none-bg:#2a2c2f; --c-due-none-text:#b5b5b5;
  --c-info:#a8dcf5; --c-info-bg:#0f2f45; --c-info-dot:#6aa7ff; --c-done:#b6efa0; --c-done-bg:#123d21; --c-done-bar:#3fbf7a;
  --c-danger:#ffb4a9; --c-danger-bg:#4a1712; --c-remind:#f3d27a; --c-remind-bg:#3d3410; --c-mark:#3f3400; --c-mark-line:#e0b84a; --c-mark-strong:#5c4c00; color-scheme:dark; }
:root[data-reduce="1"] { --t-move:0ms; }
@media (prefers-reduced-motion: reduce) { :root { --t-move:0ms; } }

* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--c-canvas); color:var(--c-ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.45; }
:focus-visible { outline:2px solid var(--c-ink); outline-offset:2px; }
.num { font-family:var(--font-display); font-variant-numeric:tabular-nums; }
.ic { flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.sub { color:var(--c-sub); }
.vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ell { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.app { display:flex; flex-direction:column; height:100%; }
.proto { display:flex; align-items:center; gap:16px; height:32px; flex:none; padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px)); border-bottom:1px solid var(--c-line); color:var(--c-sub); font-size:12px; white-space:nowrap; overflow-x:auto; }
.proto b { color:var(--c-ink); font-weight:700; }
.proto a { color:var(--c-sub); }
.proto a[aria-current] { color:var(--c-ink); font-weight:700; }
.proto .grow { flex:1; }

/* 상단 바 T0 */
.top { display:flex; align-items:stretch; gap:20px; height:60px; flex:none; padding-inline:24px; background:var(--c-surface); border-bottom:1px solid var(--c-line); }
.brand { display:flex; align-items:baseline; gap:8px; align-self:center; flex:none; text-decoration:none; color:var(--c-ink); }
.brand b { font-family:var(--font-display); font-size:20px; font-weight:700; }
.brand span { font-size:12px; color:var(--c-sub); }
.menu { display:flex; min-width:0; overflow-x:auto; scrollbar-width:none; }
.menu a { display:flex; align-items:center; padding:0 12px; border-bottom:2px solid transparent; color:var(--c-sub); font-weight:500; text-decoration:none; white-space:nowrap; transition:color var(--d-fast) var(--e-std); }
.menu a:hover { color:var(--c-ink); }
.menu a[aria-current] { border-bottom-color:var(--c-point); color:var(--c-ink); font-weight:700; }
.top .grow { flex:1; }
.sync { align-self:center; font-size:12px; color:var(--c-sub); white-space:nowrap; }
.iconbtn { position:relative; display:inline-grid; place-items:center; width:36px; height:36px; flex:none; border:0; border-radius:var(--r-ctl); background:none; color:var(--c-ink); padding:0; transition:background-color var(--d-fast) var(--e-std); }
.iconbtn:hover, .iconbtn[aria-pressed="true"], .iconbtn[aria-expanded="true"] { background:var(--c-fill); }
.iconbtn.sm { width:28px; height:28px; }
.top .iconbtn { align-self:center; }
.badge { position:absolute; top:3px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--c-ink); color:var(--c-on-strong); font:700 10px/16px var(--font-display); }
.avatar { align-self:center; display:grid; place-items:center; width:32px; height:32px; flex:none; border-radius:50%; background:var(--c-fill); font-size:13px; font-weight:500; }

main { position:relative; flex:1; min-height:0; display:flex; }
.view { flex:1; min-width:0; min-height:0; }
.view[hidden] { display:none !important; }

/* 공통 부품 */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 14px; border:1px solid var(--c-input); border-radius:var(--r-ctl); background:var(--c-surface); font-size:13px; font-weight:500; white-space:nowrap; text-decoration:none; color:var(--c-ink); transition:background-color var(--d-fast) var(--e-std), filter var(--d-fast) var(--e-std); }
.btn:hover { background:var(--c-fill); }
.btn.primary { border-color:transparent; background:var(--c-point); color:var(--c-on-strong); font-weight:700; }
.btn.primary:hover { filter:brightness(.9); }
.btn.primary:active { background:var(--c-point-press); }
.btn.ghost { border-color:transparent; background:none; }
.btn.ghost:hover { background:var(--c-fill); }
.btn.sm { height:30px; padding:0 10px; }
/* 보내기 버튼 모핑: 글자는 visibility로 숨겨 폭을 유지, 스피너 · ✓는 위에 겹침 */
.morph { position:relative; }
.morph .lbl { transition:opacity var(--d-short) var(--e-std); }
.morph .ov { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity var(--d-short) var(--e-std); }
.morph[data-state="sending"] .lbl, .morph[data-state="sent"] .lbl { visibility:hidden; opacity:0; }
.morph[data-state="sending"] .ov.s, .morph[data-state="sent"] .ov.d { opacity:1; }
.due { display:inline-flex; align-items:center; flex:none; height:20px; padding:0 6px; border-radius:var(--r-chip); font:600 12px/1 var(--font-display); white-space:nowrap; }
.due.urgent { background:var(--c-due-urgent-bg); color:var(--c-due-urgent-text); }
.due.today, .due.done { background:var(--c-due-today-bg); color:var(--c-due-today-text); }
.due.later { background:var(--c-due-later-bg); color:var(--c-due-later-text); }
.due.none { background:var(--c-due-none-bg); color:var(--c-due-none-text); }
.tag { display:inline-flex; align-items:center; gap:3px; flex:none; height:20px; padding:0 6px; border-radius:var(--r-chip); background:var(--c-fill); color:var(--c-sub); font-size:12px; white-space:nowrap; }
.tag.info { background:var(--c-info-bg); color:var(--c-info); }
.cb { position:relative; display:inline-grid; place-items:center; width:18px; height:18px; flex:none; border:1.5px solid var(--c-input); border-radius:4px; background:var(--c-surface); padding:0; transition:background-color var(--d-short) var(--e-std), border-color var(--d-short) var(--e-std); }
.cb.round { border-radius:50%; }
.cb svg { opacity:0; transform:scale(.8); transition:opacity var(--d-short) var(--e-std), transform var(--t-move) var(--e-std); color:var(--c-on-strong); }
.cb[aria-checked="true"] { border-color:var(--c-ink); background:var(--c-ink); }
.cb[aria-checked="true"] svg { opacity:1; transform:none; }
.seg { display:inline-flex; gap:2px; padding:3px; border-radius:var(--r-ctl); background:var(--c-fill); max-width:100%; overflow-x:auto; }
.seg button { height:28px; padding:0 12px; border:0; border-radius:var(--r-chip); background:none; color:var(--c-sub); font-size:13px; font-weight:500; white-space:nowrap; }
.seg button[aria-pressed="true"] { background:var(--c-surface); color:var(--c-ink); font-weight:700; box-shadow:var(--shadow-1); }
.sw { position:relative; width:40px; height:24px; flex:none; border:1.5px solid var(--c-input); border-radius:12px; background:var(--c-surface); padding:0; transition:background-color var(--d-fast) var(--e-std), border-color var(--d-fast) var(--e-std); }
.sw::after { content:''; position:absolute; top:3px; left:3px; width:15px; height:15px; border-radius:50%; background:var(--c-gray); transition:transform var(--t-move) var(--e-std), background-color var(--d-fast) var(--e-std); }
.sw[aria-checked="true"] { border-color:var(--c-ink); background:var(--c-ink); }
.sw[aria-checked="true"]::after { transform:translateX(16px); background:var(--c-on-strong); }
.input { height:36px; max-width:100%; padding:0 10px; border:1px solid var(--c-input); border-radius:var(--r-ctl); background:var(--c-surface); }
.input.time { width:auto; min-width:128px; font-family:var(--font-display); font-weight:600; font-variant-numeric:tabular-nums; }
.saved { display:inline-flex; align-items:center; gap:4px; color:var(--c-done); font-size:12px; white-space:nowrap; }
.list-h { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:8px; min-height:52px; padding:8px 12px 8px 16px; background:var(--c-surface); border-bottom:1px solid var(--c-line); }
.list-h h2 { margin:0; font-size:16px; white-space:nowrap; }
.list-h .grow { flex:1; }
.grp { padding:12px 16px 4px; color:var(--c-sub); font-size:12px; font-weight:500; }
.empty { padding:12px 16px 16px; color:var(--c-sub); }
.menu-pop { position:fixed; z-index:70; min-width:200px; padding:4px; border:1px solid var(--c-line); border-radius:var(--r-ctl); background:var(--c-surface); box-shadow:var(--shadow-2); }
.menu-pop button { display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; height:34px; padding:0 10px; border:0; border-radius:4px; background:none; text-align:left; white-space:nowrap; }
.menu-pop button:hover { background:var(--c-fill); }
.menu-pop small { color:var(--c-sub); font-size:12px; }
.menu-pop hr { margin:4px 0; border:0; border-top:1px solid var(--c-line); }

/* ── 대시보드 ── */
#v-dashboard { overflow:auto; }
.dash { display:grid; grid-template-columns:minmax(280px,360px) minmax(0,1fr); gap:20px; align-items:start; max-width:1440px; padding:24px 24px 48px; }
.col { display:flex; flex-direction:column; gap:16px; min-width:0; }
.card { min-width:0; border:1px solid var(--c-line); border-radius:var(--r-card); background:var(--c-surface); }
.card-h { display:flex; align-items:center; gap:8px; min-height:48px; padding:12px 16px 8px; }
.card-h h2 { margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.card-h .cnt { color:var(--c-gray); font:600 14px/1 var(--font-display); }
.card-h .tools { margin-left:auto; display:flex; align-items:center; gap:4px; min-width:0; }
.more { display:inline-flex; align-items:center; gap:2px; margin-right:-8px; padding:4px 8px; border:0; border-radius:var(--r-ctl); background:none; color:var(--c-sub); font-size:13px; white-space:nowrap; transition:background-color var(--d-fast) var(--e-std); }
.more:hover { background:var(--c-fill); color:var(--c-ink); }
.dot-urgent::before { content:''; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--c-ink); vertical-align:1px; }
.rows { padding:0 4px 8px; }
.types .rows { height:288px; overflow-y:auto; overscroll-behavior:contain; } /* 5줄(56px) 높이, 안에서 스크롤 */
.row { display:flex; align-items:center; gap:10px; min-height:56px; padding:8px 12px; border-radius:var(--r-ctl); transition:background-color var(--d-fast) var(--e-std); }
.row.go { cursor:pointer; }
.row.go:hover { background:var(--c-fill); }
.row .t { flex:1; min-width:0; }
.row .t1 { display:flex; align-items:center; gap:6px; min-width:0; font-weight:500; }
.row .t1 span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.newdot { width:6px; height:6px; flex:none; border-radius:50%; background:var(--c-info-dot); }
.row .t2 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--c-sub); font-size:12px; }
.row.restored { animation:restored 600ms var(--e-std); }
@keyframes restored { from { background:var(--c-mark); } to { background:transparent; } }
.plus { padding:0 12px 8px; }
.plus button { border:0; background:none; color:var(--c-sub); font-size:13px; padding:4px 0; }
.plus button:hover { color:var(--c-ink); text-decoration:underline; }
.count-card { padding:0 16px 16px; }
.when { display:flex; align-items:center; gap:4px; min-height:28px; color:var(--c-sub); font-size:13px; }
.big { display:flex; align-items:baseline; gap:4px; margin:2px 0 8px; }
.big b { font:600 40px/1.1 var(--font-display); letter-spacing:-.02em; }
.split { display:flex; gap:20px; font-size:13px; color:var(--c-sub); }
.split b { color:var(--c-ink); font:600 16px var(--font-display); margin-left:4px; }
.bar { height:6px; margin-top:10px; border-radius:3px; background:var(--c-fill); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--c-done-bar); border-radius:3px; transition:width var(--t-move) var(--e-std); }
.pending { margin-top:10px; color:var(--c-sub); font-size:12px; }
.wait { display:flex; align-items:center; gap:12px; min-height:40px; padding:8px 12px; border-radius:var(--r-ctl); }
.wait:hover { background:var(--c-fill); }
.wait span:first-child { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.check-row { display:flex; gap:8px; min-width:0; padding:8px 12px; border-radius:var(--r-ctl); font-size:13px; }
.check-row:hover { background:var(--c-fill); }
.wait.go, .check-row.go { cursor:pointer; }
.rows.five { max-height:216px; overflow-y:auto; overscroll-behavior:contain; } /* 5줄까지 보이고 안에서 스크롤 */
.check-row em { flex:none; font-style:normal; color:var(--c-sub); }
.check-row span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.types { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.types .card-h .note { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--c-sub); font-size:12px; }

/* 사이드바 · 팝오버 · 토스트 · 시트 */
.panel { position:fixed; top:92px; right:0; bottom:0; z-index:30; display:flex; flex-direction:column; width:min(480px,100vw); background:var(--c-surface); border-left:1px solid var(--c-line); box-shadow:var(--shadow-2); }
.panel-h { display:flex; align-items:center; gap:8px; padding:16px 16px 8px 20px; }
.panel-h h2 { margin:0; font-size:20px; font-weight:700; }
.panel-h .iconbtn { margin-left:auto; }
.panel-b { flex:1; overflow:auto; padding:0 8px 24px; }
.pop { position:fixed; top:84px; right:16px; z-index:50; display:flex; flex-direction:column; width:min(400px, calc(100vw - 32px)); max-height:calc(100vh - 110px); border:1px solid var(--c-line); border-radius:var(--r-card); background:var(--c-surface); box-shadow:var(--shadow-2); }
.pop-h { display:flex; align-items:center; gap:8px; padding:12px 12px 8px 16px; }
.pop-h h2 { margin:0; font-size:16px; }
.pop-b { overflow:auto; padding-bottom:4px; }
.rem { display:flex; gap:12px; padding:10px 16px; }
.rem:hover { background:var(--c-fill); }
.rem .ri { display:grid; place-items:center; width:28px; height:28px; flex:none; border-radius:var(--r-ctl); background:var(--c-remind-bg); color:var(--c-remind); }
.rem .ri.n { background:var(--c-info-bg); color:var(--c-info); }
.rem > div { min-width:0; }
.rem .t2 { color:var(--c-sub); font-size:12px; }
.pop .foot { display:flex; justify-content:flex-end; padding:6px 8px 8px; border-top:1px solid var(--c-line); }
.toast { position:fixed; left:50%; bottom:max(24px, env(safe-area-inset-bottom,0px)); z-index:80; display:flex; align-items:center; gap:8px; padding:6px 6px 6px 16px; border-radius:var(--r-card); background:var(--c-ink); color:var(--c-on-strong); box-shadow:var(--shadow-2); translate:-50% 0; max-width:calc(100vw - 32px); }
.toast span { min-width:0; }
.toast button { flex:none; border:0; border-radius:var(--r-ctl); background:none; color:var(--c-on-strong); padding:6px 10px; font-weight:700; }
.toast button:hover { background:rgba(127,127,127,.25); }
.scrim { position:fixed; inset:0; z-index:59; background:var(--c-scrim); }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:60; padding:20px 20px max(20px, env(safe-area-inset-bottom,0px)); border-radius:var(--r-sheet) var(--r-sheet) 0 0; background:var(--c-surface); box-shadow:var(--shadow-2); }
.sheet h2 { margin:0 0 8px; font-size:16px; }
.sheet ul { margin:0 0 12px; padding:0; list-style:none; }
.sheet li { display:flex; align-items:center; gap:10px; padding:6px 0; }
.sheet .opt { display:flex; align-items:center; gap:8px; margin:4px 0 16px; font-size:13px; }
.sheet .acts { display:flex; justify-content:flex-end; gap:8px; }

document.addEventListener('change', (e) => {

document.addEventListener('input', (e) => {
  if (e.target.id === 'ask-in') { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; return; }

  const f = e.target.dataset?.tplField; if (!f) return;
  const state = (d) => (!d ? 'clean' : d.name.trim() ? 'dirty' : 'empty');
  const before = state(tplDraft); tplDraft = { ...(tplDraft || tpls[tplCur]), [f]: e.target.value };
  if (JSON.stringify(tplDraft) === JSON.stringify(tpls[tplCur])) tplDraft = null;

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (e.target.id === 'ask') { const inp = $('#ask-in'); const said = inp.value.trim(); if (!said) { $('#ask-status').textContent = '요청할 일을 적어 주세요. 예: 김 팀장님 건 다 처리했어'; return; } inp.value = ''; inp.style.height = ''; listening = false; $('.mic', e.target)?.setAttribute('aria-pressed', 'false'); return ask(said); }

document.addEventListener('keydown', (e) => {

  if (typing) return;

    if (n) { e.preventDefault(); curMail = n.id; composing = null; n.unread = false; renderMail(); $(`.mi[data-mail="${n.id}"]`)?.focus(); }
  }

applyTheme();
