          <text class="ts" x="530" y="92" text-anchor="middle">서버 없이 직접 import</text>
          <rect class="n" x="660" y="52" width="160" height="52" rx="4"/>
          <text class="tb" x="740" y="75" text-anchor="middle">코드 채점</text>
          <text class="ts" x="740" y="92" text-anchor="middle">누락 · 재현율 · 정밀도</text>
          <rect class="n-ok" x="890" y="52" width="190" height="52" rx="4"/>
          <text class="tb t-ok" x="985" y="75" text-anchor="middle">사람 검수</text>
          <text class="ts" x="985" y="92" text-anchor="middle">D15</text>
          <path class="e" d="M190 78 H238" marker-end="url(#ga)"/>
