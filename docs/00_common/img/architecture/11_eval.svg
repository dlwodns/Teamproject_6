          <text class="ts" x="424" y="70" text-anchor="middle">import</text>
          <path class="e" d="M610 78 H658" marker-end="url(#ga)"/>
          <text class="ts" x="634" y="70" text-anchor="middle">예측</text>
          <path class="e" d="M820 78 H888" marker-end="url(#ga)"/>
          <text class="ts" x="854" y="70" text-anchor="middle">md 보고서</text>
          <rect class="n" x="660" y="114" width="160" height="36" rx="4"/>
          <text class="ts" x="740" y="137" text-anchor="middle">Claude 보조 채점</text>
          <path class="e-dash" d="M740 114 V106" marker-end="url(#ga)"/>
          <rect class="n-warn" x="30" y="182" width="220" height="44" rx="4"/>
          <text class="tb t-warn" x="140" y="201" text-anchor="middle">봉인 테스트 A · B</text>
