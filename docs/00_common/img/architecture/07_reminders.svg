<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1124 274" role="img" aria-label="스케줄러가 1분마다 저장된 값과 AI 신호로 리마인더 항목(6묶음)을 다시 계산하고, 항목마다 알림 시각 규칙(R-아침 · R-기한 · R-나중에 · R-회의 · R-즉시)과 알림 정책(최대 3번 · 근무 시간 · 조용한 시간 · 부재 중)으로 보낼 차례를 정한다. 보내기 직전에 업무가 아직 미처리인지 다시 보고, reminders에 한 줄 쓰며 같은 항목 · 규칙 · 시각은 한 번만 저장된다. 알림은 알림 센터에 남고 화면은 1분마다 받아 토스트로 띄운다. 웹 푸시는 진행 전이다." width="1124" height="274">
<style>
svg { --bg:#ffffff; --band:#eef1f5; --fg:#1d2330; --muted:#5b6474; --line:#a9b1bf; --surface:#ffffff;
  --exa:#2d5fa8; --exa-soft:#e5edf8; --warn:#b4531c; --warn-soft:#fbece2; --ok:#2f7a4f; --ok-soft:#e3f2e9;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#161a21; --band:#1d222b; --fg:#e4e8ef; --muted:#98a2b3; --line:#4b5466; --surface:#1f2530;
  --exa:#7aa7e8; --exa-soft:#1c2a40; --warn:#ec9a62; --warn-soft:#36231a; --ok:#6cc293; --ok-soft:#17301f; } }
.bg { fill: var(--bg); }
.band { fill: var(--band); }
.bandlabel { fill: var(--muted); font: 500 12px var(--mono); letter-spacing: .04em; }
.n { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.n-exa { fill: var(--exa-soft); stroke: var(--exa); stroke-width: 1.6; }
.n-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; }
.n-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.8; }
.n-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dot { fill: var(--fg); }
.t { fill: var(--fg); font: 400 14px var(--sans); }
.tb { fill: var(--fg); font: 600 14px var(--sans); }
.ts { fill: var(--muted); font: 400 12px var(--sans); }
.tm { fill: var(--muted); font: 400 12px var(--mono); }
.t-exa { fill: var(--exa); } .t-warn { fill: var(--warn); } .t-ok { fill: var(--ok); }
.e { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.e-exa { fill: none; stroke: var(--exa); stroke-width: 1.6; }
.e-warn { fill: none; stroke: var(--warn); stroke-width: 1.8; }
.e-ok { fill: none; stroke: var(--ok); stroke-width: 1.6; }
.e-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.e-dash { fill: none; stroke: var(--fg); stroke-width: 1.3; stroke-dasharray: 5 4; }
.ah { fill: var(--fg); } .ah-exa { fill: var(--exa); } .ah-warn { fill: var(--warn); } .ah-ok { fill: var(--ok); }
.divider { stroke: var(--band); stroke-width: 2; }
</style>
