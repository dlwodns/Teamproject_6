<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 344" role="img" aria-label="규칙이 찾은 할 일과 엑사원이 근거를 갖고 더 찾은 할 일은 할 일 칸으로 간다. 엑사원만 만든 할 일 중 나를 향하지 않은 문장, 대상자 당부 공지, 참고만 해 달라는 메일, 선택 요청에서 나온 것은 확인 칸으로 내린다. 둘 다 없으면 참고 칸이다." width="1024" height="344">
<style>
svg { --bg:#ffffff; --band:#eef1f5; --fg:#1d2330; --muted:#5b6474; --line:#a9b1bf; --surface:#ffffff;
  --exa:#2d5fa8; --exa-soft:#e5edf8; --warn:#b4531c; --warn-soft:#fbece2; --ok:#2f7a4f; --ok-soft:#e3f2e9;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#161a21; --band:#1d222b; --fg:#e4e8ef; --muted:#98a2b3; --line:#4b5466; --surface:#1f2530;
  --exa:#7aa7e8; --exa-soft:#1c2a40; --warn:#ec9a62; --warn-soft:#36231a; --ok:#6cc293; --ok-soft:#17301f; } }
.bg { fill: var(--bg); }
.band { fill: var(--band); }
.bandlabel { fill: var(--muted); font: 500 12px var(--mono); letter-spacing: .04em; }
.n { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.n-exa { fill: var(--exa-soft); stroke: var(--exa); stroke-width: 1.6; }
.n-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; }
.n-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.8; }
.n-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dot { fill: var(--fg); }
.t { fill: var(--fg); font: 400 14px var(--sans); }
.tb { fill: var(--fg); font: 600 14px var(--sans); }
.ts { fill: var(--muted); font: 400 12px var(--sans); }
.tm { fill: var(--muted); font: 400 12px var(--mono); }
.t-exa { fill: var(--exa); } .t-warn { fill: var(--warn); } .t-ok { fill: var(--ok); }
.e { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.e-exa { fill: none; stroke: var(--exa); stroke-width: 1.6; }
.e-warn { fill: none; stroke: var(--warn); stroke-width: 1.8; }
.e-ok { fill: none; stroke: var(--ok); stroke-width: 1.6; }
.e-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.e-dash { fill: none; stroke: var(--fg); stroke-width: 1.3; stroke-dasharray: 5 4; }
.ah { fill: var(--fg); } .ah-exa { fill: var(--exa); } .ah-warn { fill: var(--warn); } .ah-ok { fill: var(--ok); }
.divider { stroke: var(--band); stroke-width: 2; }
</style>
<rect class="bg" x="-12" y="-12" width="1024" height="344"/>
          <defs>
            <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="f3x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-exa" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="f3w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
          <text class="bandlabel" x="20" y="14">합치기에서 나온 것</text>
          <text class="ts t-warn" x="20" y="326">11-06 기록 · 지금은 AI-D19(판단은 모두 모델) · 칸(lane) 할 일 · 확인 · 참고는 그대로</text>
          <text class="bandlabel" x="620" y="14">화면 칸 · lane</text>

          <rect class="n" x="20" y="26" width="360" height="44" rx="4"/>
          <text class="t" x="36" y="53">규칙이 찾은 할 일</text>
          <rect class="n-exa" x="20" y="90" width="360" height="44" rx="4"/>
          <text class="t" x="36" y="117">엑사원이 더 찾은 할 일 <tspan class="ts">(근거 있음)</tspan></text>
          <rect class="n-exa" x="20" y="154" width="360" height="86" rx="4"/>
          <text class="tb" x="36" y="180">엑사원만 만든 할 일 중</text>
          <text class="ts" x="36" y="204">· 나를 향하지 않은 문장 ('전 임직원은 ~')</text>
          <text class="ts" x="36" y="224">· 대상자 당부 공지 · '참고만 해 주세요' · 선택 요청</text>
          <rect class="n" x="20" y="260" width="360" height="44" rx="4"/>
          <text class="t" x="36" y="287">할 일도 확인 항목도 없음</text>

          <rect class="n-ok" x="620" y="26" width="360" height="108" rx="4"/>
          <text class="tb t-ok" x="640" y="58">할 일</text>
          <text class="tm" x="640" y="80">tasks · 항목마다 카드</text>
          <rect class="n-warn" x="620" y="154" width="360" height="86" rx="4"/>
          <text class="tb t-warn" x="640" y="186">확인</text>
          <text class="tm" x="640" y="208">checks · 메일당 최대 1개</text>
          <rect class="n" x="620" y="260" width="360" height="44" rx="4"/>
          <text class="tb" x="640" y="287">참고 <tspan class="tm">· 업무 없음</tspan></text>

          <path class="e" d="M380 48 H617" marker-end="url(#f3a)"/>
          <text class="ts" x="500" y="40" text-anchor="middle">항상 남김 · D15</text>
          <path class="e-exa" d="M380 112 H617" marker-end="url(#f3x)"/>
          <text class="ts t-exa" x="500" y="104" text-anchor="middle">합침</text>
          <path class="e-warn" d="M380 197 H617" marker-end="url(#f3w)"/>
          <text class="ts t-warn" x="500" y="189" text-anchor="middle">버리지 않고 내림</text>
          <path class="e" d="M380 282 H617" marker-end="url(#f3a)"/>
          <text class="ts" x="500" y="274" text-anchor="middle">참고로</text>
        </svg>
