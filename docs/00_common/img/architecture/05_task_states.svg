<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1024 364" role="img" aria-label="업무는 미처리에서 시작해 완료, 제외, 나중에로 갈 수 있고 세 상태 모두 되돌리기로 미처리에 돌아온다. 나중에는 until 시각이 되면 리마인더와 함께 미처리로 돌아온다." width="1024" height="364">
<style>
svg { --bg:#ffffff; --band:#eef1f5; --fg:#1d2330; --muted:#5b6474; --line:#a9b1bf; --surface:#ffffff;
  --exa:#2d5fa8; --exa-soft:#e5edf8; --warn:#b4531c; --warn-soft:#fbece2; --ok:#2f7a4f; --ok-soft:#e3f2e9;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"D2Coding",monospace; }
@media (prefers-color-scheme: dark) { svg { --bg:#161a21; --band:#1d222b; --fg:#e4e8ef; --muted:#98a2b3; --line:#4b5466; --surface:#1f2530;
  --exa:#7aa7e8; --exa-soft:#1c2a40; --warn:#ec9a62; --warn-soft:#36231a; --ok:#6cc293; --ok-soft:#17301f; } }
.bg { fill: var(--bg); }
.band { fill: var(--band); }
.bandlabel { fill: var(--muted); font: 500 12px var(--mono); letter-spacing: .04em; }
.n { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.n-exa { fill: var(--exa-soft); stroke: var(--exa); stroke-width: 1.6; }
.n-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; }
.n-ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.8; }
.n-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dot { fill: var(--fg); }
.t { fill: var(--fg); font: 400 14px var(--sans); }
.tb { fill: var(--fg); font: 600 14px var(--sans); }
.ts { fill: var(--muted); font: 400 12px var(--sans); }
.tm { fill: var(--muted); font: 400 12px var(--mono); }
.t-exa { fill: var(--exa); } .t-warn { fill: var(--warn); } .t-ok { fill: var(--ok); }
.e { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.e-exa { fill: none; stroke: var(--exa); stroke-width: 1.6; }
.e-warn { fill: none; stroke: var(--warn); stroke-width: 1.8; }
.e-ok { fill: none; stroke: var(--ok); stroke-width: 1.6; }
.e-ghost { fill: none; stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.e-dash { fill: none; stroke: var(--fg); stroke-width: 1.3; stroke-dasharray: 5 4; }
.ah { fill: var(--fg); } .ah-exa { fill: var(--exa); } .ah-warn { fill: var(--warn); } .ah-ok { fill: var(--ok); }
.divider { stroke: var(--band); stroke-width: 2; }
</style>
<rect class="bg" x="-12" y="-12" width="1024" height="364"/>
          <defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-exa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-warn" d="M0,0 L10,5 L0,10 z"/></marker><marker id="co" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-ok" d="M0,0 L10,5 L0,10 z"/></marker></defs>
          <rect class="n" x="400" y="140" width="160" height="60" rx="4"/>
          <text class="tb" x="480" y="167" text-anchor="middle">미처리</text>
          <text class="ts" x="480" y="184" text-anchor="middle">pending · 칸 · 미처리 수</text>
          <rect class="n-ok" x="780" y="40" width="160" height="60" rx="4"/>
          <text class="tb t-ok" x="860" y="67" text-anchor="middle">완료</text>
          <text class="ts" x="860" y="84" text-anchor="middle">done · 완료율에만</text>
          <rect class="n-warn" x="780" y="230" width="160" height="60" rx="4"/>
          <text class="tb t-warn" x="860" y="257" text-anchor="middle">제외</text>
          <text class="ts" x="860" y="274" text-anchor="middle">excluded · 숨김</text>
          <rect class="n-exa" x="80" y="140" width="160" height="60" rx="4"/>
          <text class="tb t-exa" x="160" y="167" text-anchor="middle">나중에</text>
          <text class="ts" x="160" y="184" text-anchor="middle">snoozed · 캘린더에</text>
          <circle cx="440" cy="322" r="6" class="dot"/>
          <path class="e" d="M440 316 V202" marker-end="url(#ca)"/>
          <text class="ts" x="432" y="300" text-anchor="end">분류 결과 저장</text>
          <path class="e-ok" d="M480 140 V56 H778" marker-end="url(#co)"/>
          <text class="ts" x="630" y="48" text-anchor="middle">☐ 체크 · 일괄 · 답장 후 '예' · 에이전트 · MCP</text>
          <path class="e" d="M778 86 H540 V138" marker-end="url(#ca)"/>
          <text class="ts" x="660" y="78" text-anchor="middle">되돌리기</text>
          <path class="e-warn" d="M480 200 V284 H778" marker-end="url(#cw)"/>
          <text class="ts" x="630" y="302" text-anchor="middle">업무 아님 · 에이전트 제외</text>
          <path class="e" d="M778 244 H540 V202" marker-end="url(#ca)"/>
          <text class="ts" x="660" y="238" text-anchor="middle">복원 · 되돌리기</text>
          <path class="e-exa" d="M400 162 H242" marker-end="url(#cx)"/>
          <text class="ts" x="320" y="154" text-anchor="middle">나중에(until)</text>
          <path class="e" d="M242 182 H398" marker-end="url(#ca)"/>
          <text class="ts" x="320" y="198" text-anchor="middle">until 도래 · 되돌리기</text>
          <path class="e-dash" d="M420 140 V112 H380 V150 H398" marker-end="url(#ca)"/>
          <text class="ts" x="372" y="108" text-anchor="end">답장 후 '아니오' · Esc</text>
        </svg>
